name: build-deploy

on:
  schedule:
    # Primary slot. GitHub sometimes drops a scheduled run, so the second line
    # is a backup half a step later. Both use the same model-run check.
    - cron: '47 */3 * * *'
    - cron: '17 1-23/3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the published model run is current
        type: boolean
        default: false
  push:
    # Only main may deploy to github-pages. The workflow file that runs is the
    # one on the pushed commit, so a side branch cannot be the trigger.
    branches: [main]
    paths: ['trigger/build.txt']
  issues:
    # An issues event runs the workflow file on the default branch.
    types: [opened]

permissions:
  contents: read

jobs:
  build:
    # Only the data jobs share the group. A skipped issue must not cancel a
    # queued schedule, and close-issue stays outside the group.
    concurrency:
      group: pages-data
      cancel-in-progress: false
    if: github.event_name != 'issues' || (github.event.issue.title == 'build' && (github.event.issue.user.login == 'jsnielsendk' || github.event.issue.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.freshness.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide from the DMI model run
        id: freshness
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        run: node --experimental-strip-types scripts/buildDecision.ts
      - if: steps.freshness.outputs.skip != 'true'
        run: npm ci
      - name: Build data
        if: steps.freshness.outputs.skip != 'true'
        run: npm run build-data
        env:
          # Pause between DMI calls. Retries have their own capped backoff.
          DMI_PAUSE_MS: '2000'
      - if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    concurrency:
      group: pages-data
      cancel-in-progress: false
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  close-issue:
    needs: [build, deploy]
    if: always() && github.event_name == 'issues' && github.event.issue.title == 'build' && (github.event.issue.user.login == 'jsnielsendk' || github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment and close the build issue
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_SKIP: ${{ needs.build.outputs.skip }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            word=failed
          elif [ "$BUILD_SKIP" = "true" ]; then
            word=skipped
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            word=built
          else
            word=failed
          fi
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "$word ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
