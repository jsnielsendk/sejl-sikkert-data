name: build-deploy

on:
  schedule:
    # Primary slot. GitHub sometimes drops a scheduled run, so the second line
    # is a backup half a step later. A fresh manifest skips DMI.
    - cron: '47 */3 * * *'
    - cron: '17 1-23/3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.freshness.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published manifest age
        id: freshness
        if: github.event_name == 'schedule'
        run: node --experimental-strip-types scripts/manifestFreshness.ts
      - if: steps.freshness.outputs.skip != 'true'
        run: npm ci
      - name: Build data
        if: steps.freshness.outputs.skip != 'true'
        run: npm run build-data
        env:
          # Raise this if Actions often gets HTTP 429. Do not raise the attempt cap.
          DMI_PAUSE_MS: '2000'
      - if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
